name: Build VLC Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup VLC Headers
        run: |
          mkdir vlc_sdk
          curl -L https://github.com/videolan/vlc/archive/refs/heads/master.tar.gz -o vlc.tar.gz
          tar -xzf vlc.tar.gz
          mkdir vlc_sdk/include
          cp -r vlc-master/include/* vlc_sdk/include/
      - name: Build with MinGW
        run: |
          # Use bash to execute a sequential script to avoid PowerShell escaping issues
          # We ensure we are in the root directory before creating the build folder
          bash -c "mkdir -p build && cd build && cmake -G 'MinGW Makefiles' -DCMAKE_C_COMPILER=gcc -DCMAKE_C_FLAGS='-fPIC' -DVLC_INCLUDE_DIR=\"${{ github.workspace }}/vlc_sdk/include\" .. && make"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-shuffle-win64
          path: build/smart_shuffle.dll
