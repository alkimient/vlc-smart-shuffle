name: Build VLC Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSYS2 and Toolchain
        run: choco install cmake
      - name: Build Plugin
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-shuffle-win64
          path: build/smart_shuffle.dll

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev cmake gcc
      - name: Build Plugin
        run: |
          mkdir build && cd build
          cmake ..
          make
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-shuffle-linux
          path: build/smart_shuffle.so
