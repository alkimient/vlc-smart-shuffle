name: Build VLC Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: choco install cmake
      - name: Setup VLC Headers
        run: |
          mkdir vlc_sdk
          curl -L https://github.com/videolan/vlc/archive/refs/heads/master.tar.gz -o vlc.tar.gz
          tar -xzf vlc.tar.gz
          mkdir vlc_sdk/include
          cp -r vlc-master/include/* vlc_sdk/include/
      - name: Build Plugin
        run: |
          mkdir build
          cd build
          cmake -DVLC_INCLUDE_DIR="${{ github.workspace }}/vlc_sdk/include" ..
          cmake --build .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-shuffle-win64
          path: build/smart_shuffle.dll

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev cmake gcc
      - name: Build Plugin
        run: |
          mkdir build && cd build
          cmake ..
          make
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-shuffle-linux
          path: build/smart_shuffle.so
