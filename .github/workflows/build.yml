name: Build VLC Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup VLC Headers
        run: |
          mkdir vlc_sdk
          curl -L https://github.com/videolan/vlc/archive/refs/heads/master.tar.gz -o vlc.tar.gz
          tar -xzf vlc.tar.gz
          mkdir vlc_sdk/include
          cp -r vlc-master/include/* vlc_sdk/include/
      - name: Build with MinGW
        run: |
          bash -c "cmake -S . -B build -G 'MinGW Makefiles' -DCMAKE_C_COMPILER=gcc -DCMAKE_C_FLAGS='-fPIC' -DVLC_INCLUDE_DIR=\"${{ github.workspace }}/vlc_sdk/include\" && cmake --build build"
      - name: Find DLL Path
        run: |
          # Find where the DLL actually landed and save it to an environment file
          $dllPath = (Get-ChildItem -Path build -Filter "smart_shuffle.dll" -Recurse).FullName
          if ($dllPath) {
            echo "DLL_PATH=$dllPath" >> $env:GITHUB_ENV
            echo "Found DLL at: $dllPath"
          } else {
            echo "DLL not found in build directory"
            exit 1
          }
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-shuffle-win64
          path: ${{ env.DLL_PATH }}
